[package]
name = "flow-web-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.13.3", features = ["stream", "json", "form", "brotli", "gzip", "rustls", "socks"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
webm-iterable = "0.7.1"
lofty = "0.25.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23"
snowstem = "0.1"
unicode-normalization = "0.1"
icu_properties = "2"
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "aes", "x25519", "getrandom"] }
bip39 = "3"
subtle = "2"
hex = "0.4"
md-5 = "0.11"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
mp4-atom = { version = "0.17", default-features = false }
deunicode = "1.6.2"
encoding_rs = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
proptest = "1.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flow_web_headless)'] }
