name: Feature request
description: Suggest an improvement specific to Flow Web.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing requests and the web runtime parity tracker.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Relevant browsers, devices or server platforms
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security, compatibility or data impact
