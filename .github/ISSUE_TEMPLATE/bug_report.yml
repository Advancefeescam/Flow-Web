name: Bug report
description: Report a reproducible problem in Flow Web.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the web runtime documentation and existing reports.
          required: true
        - label: I removed credentials, cookies, signed media URLs and personal data.
          required: true
  - type: input
    id: commit
    attributes:
      label: Flow Web commit or version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and client OS
      placeholder: Safari / iPadOS, Chrome / Windows, Firefox / Linux
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server OS, architecture and deployment
      placeholder: Debian ARM64 / Podman Compose / source build
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Video playback or seeking
        - Music
        - Search or browsing
        - Library or recommendations
        - Downloads
        - PWA or responsive UI
        - Server, authentication or deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, screenshots or public video URL
      description: Redact secrets, signed media URLs and private instance addresses.
