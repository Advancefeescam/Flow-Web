name: Web runtime checks
on:
  push:
    branches: [main, refactor/web-only, 'web-export/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the pinned web export
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate="${PR_HEAD:-HEAD}"
          source="$(git show "$candidate:UPSTREAM.lock" | python3 -c 'import json,sys; print(json.load(sys.stdin)["integration_commit"])')"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$source" refs/remotes/origin/integration/desktop
          python3 scripts/export-web.py "$source" --verify "$candidate"
          [[ "$(git rev-parse "$candidate^{tree}")" == "$(git rev-parse 'HEAD^{tree}')" ]] || {
            echo "Merge result changes the generated tree; regenerate from current main." >&2
            exit 1
          }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build --mode web
      - run: cargo check --all-targets
        working-directory: web-server
      - run: cargo test
        working-directory: web-server
