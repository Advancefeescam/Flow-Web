name: Prepare Flow Desktop update
on:
  schedule:
    - cron: '24 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact release tag (blank uses latest stable release)'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-flow-desktop-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/desktop
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare reviewable update
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh api repos/Flow-Tube/Flow-Desktop/releases/latest --jq .tag_name)"
          fi
          [[ -n "$tag" ]]
          bash scripts/prepare-upstream.sh "$tag"
